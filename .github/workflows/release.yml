name: Release

# The built UI is not committed, so a plain clone of this repo will not run. Tagging a
# version builds it here and attaches a drop-in zip to the GitHub release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, e.g. v1.0.0 (the leading v is optional)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Before checkout, because checkout needs a ref that actually exists. Typing the
      # version without the leading v is the obvious thing to do on the Run workflow
      # form, and left to itself checkout fails with a bare "git failed with exit code 1".
      - name: Resolve tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          PUSHED_TAG: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$PUSHED_TAG}"
          case "$tag" in v*) ;; *) tag="v$tag" ;; esac

          if ! gh api "repos/${{ github.repository }}/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::tag $tag does not exist in ${{ github.repository }}"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Verify version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          manifest=$(sed -n "s/^version[[:space:]]*'\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)'.*/\1/p" fxmanifest.lua)

          # The zip is named after the tag and the resource reports the manifest version;
          # if they disagree, every install looks like the wrong build.
          if [ "${TAG#v}" != "$manifest" ]; then
            echo "::error::tag $TAG does not match fxmanifest.lua version $manifest"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Stage the resource
        run: |
          mkdir -p dist/oxide-helptext/web
          cp -r fxmanifest.lua LICENSE README.md client server shared compat dist/oxide-helptext/
          if [ -d docs ]; then cp -r docs dist/oxide-helptext/; fi
          cp -r web/dist dist/oxide-helptext/web/

          # Nothing that only matters to this repo belongs in a server owner's zip.
          test ! -e dist/oxide-helptext/web/src
          test ! -e dist/oxide-helptext/web/node_modules
          test -f dist/oxide-helptext/web/dist/index.html
          test -f dist/oxide-helptext/compat/ox_lib.lua

      - name: Package
        run: cd dist && zip -qr ../oxide-helptext.zip oxide-helptext

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" oxide-helptext.zip --clobber
          else
            gh release create "$TAG" oxide-helptext.zip --generate-notes
          fi
